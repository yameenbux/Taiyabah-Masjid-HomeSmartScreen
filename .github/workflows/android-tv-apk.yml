name: Build TV APK

# Builds a sideloadable APK for the mosque's Fire TV sticks (and Android TV).
# Run it from the Actions tab — no desktop, no Android Studio, no local SDK.
#
# The output is attached to a GitHub Release, which gives a stable public
# HTTPS URL. That URL is what you type into the Downloader app on the stick.
#
# Because the app is a WebView wrapping the live site, you almost never need
# to re-run this: prayer times, audio fixes and layout changes all reach the
# stick on their own. Rebuild only when the app shell changes — name, icon,
# banner, package id, or the TV manifest patches.

on:
  workflow_dispatch:
    inputs:
      release_notes:
        description: "What changed in this build (shown on the Release)"
        required: false
        default: "Rebuilt from the current live site."

permissions:
  contents: write        # needed to publish the Release

env:
  TWA_DIR: twa
  PACKAGE_ID: com.taiyabahmasjid.homescreen

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # AGP 8.9 requires JDK 17 — not 21, not 11.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Bubblewrap
        run: npm install -g @bubblewrap/cli@1.25.0

      - name: Install the SDK pieces the generated project asks for
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0" "platform-tools"

      # Bubblewrap prompts to download its own JDK/SDK unless it already has
      # paths configured. Point it at the runner's.
      - name: Point Bubblewrap at the runner's JDK and SDK
        run: |
          set -euo pipefail
          mkdir -p ~/.bubblewrap
          printf '{"jdkPath":"%s","androidSdkPath":"%s"}\n' "$JAVA_HOME" "$ANDROID_HOME" > ~/.bubblewrap/config.json
          cat ~/.bubblewrap/config.json

      - name: Stage the TWA config
        run: |
          set -euo pipefail
          mkdir -p "$TWA_DIR"
          # Version code must increase for an install to upgrade in place
          # rather than being rejected; the run number gives us that for free.
          python3 - <<'PY'
          import json, os
          cfg = json.load(open('android-tv/twa-manifest.json'))
          cfg['appVersionCode'] = int(os.environ['GITHUB_RUN_NUMBER'])
          cfg['appVersionName'] = os.environ['GITHUB_RUN_NUMBER']
          json.dump(cfg, open(os.path.join(os.environ['TWA_DIR'], 'twa-manifest.json'), 'w'), indent=2)
          print('fallbackType =', cfg['fallbackType'], '(must be webview: Fire OS has no Chrome)')
          print('versionCode  =', cfg['appVersionCode'])
          PY

      - name: Provide a signing key
        id: key
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -n "${KEYSTORE_B64:-}" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$TWA_DIR/android.keystore"
            echo "stable=true" >> "$GITHUB_OUTPUT"
            echo "::notice::Signed with the stored keystore — installs will upgrade in place."
          else
            # No keystore configured. Generate a throwaway so the build still
            # produces something installable, but say plainly what that costs.
            # The key is NEVER uploaded: this repo is public, and Actions
            # artifacts on a public repo are downloadable by anyone.
            keytool -genkeypair -v -keystore "$TWA_DIR/android.keystore" \
              -alias taiyabah -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass throwaway -keypass throwaway \
              -dname "CN=Taiyabah Masjid, OU=Home Smart Screen, O=Bolton Central Islamic Society, C=GB"
            echo "stable=false" >> "$GITHUB_OUTPUT"
            echo "::warning::No ANDROID_KEYSTORE_BASE64 secret set. Built with a throwaway key that is discarded when this job ends. The APK installs and runs, but a later build cannot upgrade it in place — you would have to uninstall first. See the job summary."
          fi
          echo "KEYSTORE_PASSWORD=${KEYSTORE_PASSWORD:-throwaway}" >> "$GITHUB_ENV"
          echo "KEY_PASSWORD=${KEY_PASSWORD:-throwaway}" >> "$GITHUB_ENV"

      - name: Generate the Android project
        working-directory: ${{ env.TWA_DIR }}
        env:
          BUBBLEWRAP_KEYSTORE_PASSWORD: ${{ env.KEYSTORE_PASSWORD }}
          BUBBLEWRAP_KEY_PASSWORD: ${{ env.KEY_PASSWORD }}
        run: bubblewrap update --skipVersionUpgrade

      - name: Patch the manifest for TV launchers
        run: python3 android-tv/patch-manifest.py "$TWA_DIR/app/src/main/AndroidManifest.xml"

      - name: Install the TV launcher banners
        run: |
          set -euo pipefail
          for d in xhdpi:320x180 xxhdpi:480x270 xxxhdpi:640x360; do
            density="${d%%:*}"; size="${d##*:}"
            mkdir -p "$TWA_DIR/app/src/main/res/drawable-$density"
            cp "android-tv/banner-$density-$size.png" "$TWA_DIR/app/src/main/res/drawable-$density/banner.png"
          done
          ls -l "$TWA_DIR"/app/src/main/res/drawable-*/banner.png

      - name: Build
        working-directory: ${{ env.TWA_DIR }}
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew --no-daemon assembleRelease

      - name: Sign and verify
        run: |
          set -euo pipefail
          BT="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)"
          UNSIGNED="$(find "$TWA_DIR/app/build/outputs/apk/release" -name '*.apk' | head -1)"
          echo "build-tools: $BT"
          echo "unsigned:    $UNSIGNED"
          "$BT/zipalign" -v -p 4 "$UNSIGNED" aligned.apk > /dev/null
          "$BT/apksigner" sign \
            --ks "$TWA_DIR/android.keystore" --ks-key-alias taiyabah \
            --ks-pass "pass:$KEYSTORE_PASSWORD" --key-pass "pass:$KEY_PASSWORD" \
            --out taiyabah-tv.apk aligned.apk
          "$BT/apksigner" verify --print-certs taiyabah-tv.apk | tee verify.txt
          # targetSdk 36 means Android rejects a v1-only signature. Assert it.
          "$BT/apksigner" verify --verbose taiyabah-tv.apk | grep -q "v2 scheme (APK Signature Scheme v2): true" \
            || { echo "FAIL: APK is not v2-signed; it will not install"; exit 1; }
          echo "v2 signature confirmed"

      - name: Job summary
        run: |
          {
            echo "## TV APK built"
            echo
            echo "- Package: \`$PACKAGE_ID\`"
            echo "- Version code: \`$GITHUB_RUN_NUMBER\`"
            echo "- Renderer: WebView (Fire OS has no Chrome, so a Custom Tabs TWA would open blank)"
            echo
            if [ "${{ steps.key.outputs.stable }}" = "true" ]; then
              echo "Signed with the stored keystore, so this upgrades an existing install in place."
            else
              echo "> **Throwaway signing key.** This APK installs and runs, but a future build"
              echo "> **cannot upgrade it** — you would have to uninstall first. To fix, generate a"
              echo "> keystore once and add \`ANDROID_KEYSTORE_BASE64\`, \`ANDROID_KEYSTORE_PASSWORD\`"
              echo "> and \`ANDROID_KEY_PASSWORD\` as repository secrets. See \`docs/android-tv.md\`."
            fi
            echo
            echo "### Install on the stick"
            echo "1. Fire TV: Settings → My Fire TV → Developer Options → **Apps from Unknown Sources** → on"
            echo "2. Install **Downloader** from the Amazon Appstore"
            echo "3. Enter the APK URL from this run's Release"
            echo "4. Open the app and press **OK** on the sound pill once — that unlocks audio"
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: taiyabah-tv-apk
          path: |
            taiyabah-tv.apk
            verify.txt

      - name: Publish a Release so Downloader has a URL
        env:
          GH_TOKEN: ${{ github.token }}
          # Passed as an env var, never interpolated into the shell command:
          # ${{ }} expansion happens before the shell sees it, so a quote or a
          # $(...) in the input would otherwise run as code.
          RELEASE_NOTES: ${{ inputs.release_notes }}
        run: |
          set -euo pipefail
          TAG="tv-build-$GITHUB_RUN_NUMBER"
          {
            printf '%s\n\n' "$RELEASE_NOTES"
            printf 'Package `%s`, version code `%s`, WebView renderer.\n' "$PACKAGE_ID" "$GITHUB_RUN_NUMBER"
            printf 'Install with Downloader on the Fire TV stick using the .apk link below.\n'
          } > notes.md
          gh release create "$TAG" taiyabah-tv.apk \
            --title "TV APK build $GITHUB_RUN_NUMBER" \
            --notes-file notes.md
          echo "Paste this into Downloader on the stick:"
          gh release view "$TAG" --json assets --jq '.assets[].browser_download_url'
